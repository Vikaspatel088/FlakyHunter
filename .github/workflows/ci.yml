name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project and dev dependencies
        run: |
          pip install --upgrade pip
          pip install setuptools wheel
          pip install -e ".[dev]"

      - name: Verify plugin entry-point is discoverable
        run: |
          python -c "import importlib.metadata; eps = importlib.metadata.entry_points(group='pytest11'); names = [e.name for e in eps]; assert 'flakyhunter' in names, f'flakyhunter not in {names}'"

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/ demo/

      - name: Format check with Ruff
        run: |
          ruff format --check src/ tests/ demo/

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short

      - name: Verify package build
        run: |
          pip install build
          python -m build --wheel --no-isolation
          pip install dist/*.whl --force-reinstall
